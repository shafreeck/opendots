<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f7f4"><title>登录 · opendots</title><link rel="stylesheet" href="/styles.css"><script src="/login.js" defer></script></head>
<body><main class="conversation"><div class="brand"><i class="mark" aria-hidden="true"></i>opendots</div><section class="panel panel-pad" aria-labelledby="login-title"><h1 class="page-title" id="login-title">登录个人空间</h1><p class="small muted" id="login-description">使用你已配置的个人登录凭据。登录后仍是同一个助理与对话。</p><form id="login-form" action="/api/auth/login" method="post"><label class="form-field"><span id="credential-label">登录凭据</span><input id="credential" name="credential" type="password" autocomplete="current-password" maxlength="1024" required disabled></label><label class="form-field">设备名称<input id="device-label" name="deviceLabel" type="text" autocomplete="off" maxlength="80" value="当前浏览器" required disabled></label><p class="inline-error" id="login-error" role="alert" hidden></p><button id="login-submit" type="submit" disabled>登录</button></form><p class="small muted">本页不创建账户或重设凭据。设备会话可在已登录的个人空间中撤销。</p></section><p class="small muted" id="login-status" role="status">正在检查登录状态…</p></main></body>
</html>
